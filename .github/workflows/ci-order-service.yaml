name: CI Order Service

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/order-service/**'
      - ".github/workflows/ci-order-service.yaml"

jobs:
  # ==========================================
  # JOB 1: CHẠY TRÊN CLOUD (UNIT TEST & BUILD IMAGE)
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & Run Unit Tests
      run: |
        cd src/order-service
        pip install --no-cache-dir -r requirements.txt pytest pytest-mock
        pytest test_app.py

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Downcase REPO name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY_LOWER,,}" >> $GITHUB_ENV
      env:
        GITHUB_REPOSITORY_LOWER: ${{ github.repository }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./src/order-service
        push: true
        tags: ghcr.io/${{ env.REPO_LOWER }}/order-service:${{ github.sha }}

  # ==========================================
  # JOB 2: CHẠY TẠI K8S LOCAL QUA ARC (INTEGRATION TEST)
  # ==========================================
  integration-test:
    runs-on: arc-runner-set
    needs: build-and-push
    
    # 🌟 CẢI TIẾN: Chỉ định chạy các step trong một Container có sẵn Python Cache
    container:
      image: catthedev/ubuntu-act-runner:24.04
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Downcase REPO name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY_LOWER,,}" >> $GITHUB_ENV
      env:
        GITHUB_REPOSITORY_LOWER: ${{ github.repository }}

    # BƯỚC ĐÃ ĐƯỢC SỬA LỖI QUYỀN GHI (PERMISSION DENIED)
    - name: Install Kubernetes CLI Tools inside Pod Runner
      run: |
        echo "📥 Đang tải Kubectl nội bộ cho hệ điều hành của Pod..."
        curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
        chmod +x kubectl
        
        echo "📥 Đang tải Helm nội bộ không cần quyền Root..."
        curl -LO "https://get.helm.sh/helm-v3.13.1-linux-amd64.tar.gz"
        tar -zxvf helm-v3.13.1-linux-amd64.tar.gz
        mv linux-amd64/helm ./helm
        chmod +x helm
        rm -rf linux-amd64 helm-v3.13.1-linux-amd64.tar.gz
        
        # Đăng ký PATH nội bộ cho luồng GHA
        echo "${{ github.workspace }}" >> $GITHUB_PATH

    - name: Setup Ephemeral Environment & Run Integration Test
      run: |
        NS="test-order-service-${{ github.run_id }}-${{ github.run_attempt }}"
        echo "Namespace tạm thời: $NS"
        
        kubectl create namespace $NS
        
        helm install kafka-test ./helm-charts/kafka-infra --namespace $NS
        kubectl rollout status deployment/kafka --namespace $NS --timeout=90s
        
        # Cài đặt toàn bộ ứng dụng Microservices (Truyền chuẩn xác cả cặp name và value cho env)
        helm install app-test ./helm-charts/app-dev --namespace $NS           --set services.order-service.repository=ghcr.io/${{ env.REPO_LOWER }}/order-service           --set services.order-service.tag=${{ github.sha }}           --set services.notification-service.env[0].name="KAFKA_BOOTSTRAP_SERVERS"           --set services.notification-service.env[0].value="kafka-service.$NS.svc.cluster.local:9092"           --set services.order-service.env[0].name="KAFKA_BOOTSTRAP_SERVERS"           --set services.order-service.env[0].value="kafka-service.$NS.svc.cluster.local:9092"

        kubectl rollout status deployment/order-service --namespace $NS --timeout=60s

        pip install pytest httpx
        pytest src/order-service/integration_test.py --ns=$NS
        
    - name: Purge Ephemeral Environment (Anti-Trash)
      if: always()
      run: |
        NS="test-order-service-${{ github.run_id }}-${{ github.run_attempt }}"
        echo "🧹 Đang dọn dẹp triệt để namespace tạm: $NS"
        kubectl delete namespace $NS --ignore-not-found=true

  # ==========================================
  # JOB 3: QUAY LẠI CLOUD (SỬA TAG FILE MANIFEST CHÍNH THỨC)
  # ==========================================
  update-gitops-manifest:
    runs-on: ubuntu-latest
    needs: integration-test
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Downcase REPO name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY_LOWER,,}" >> $GITHUB_ENV
      env:
        GITHUB_REPOSITORY_LOWER: ${{ github.repository }}

    - name: Update Image Tag in Helm values.yaml
      run: |
        yq -i '.services."order-service".repository = "ghcr.io/'"${{ env.REPO_LOWER }}"'/order-service"' helm-charts/app-dev/values.yaml
        yq -i '.services."order-service".tag = "${{ github.sha }}"' helm-charts/app-dev/values.yaml

    - name: Commit and Push Manifest Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add helm-charts/app-dev/values.yaml
        
        git commit -m "chore(gitops): update order-service helm tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
        
        for i in {1..5}; do
          echo "Đang thử push lần $i..."
          git pull --rebase origin hybrid-helm-dev
          if git push origin hybrid-helm-dev; then
            echo "✅ Push cấu hình thành công, chờ ArgoCD đồng bộ!"
            exit 0
          fi
          echo "❌ Trùng lịch push với service khác, đang đợi rebase lại..."
          sleep $(((RANDOM % 5 + 2)))
        done
        exit 1
