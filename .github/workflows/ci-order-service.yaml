name: CI Order Service

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/order-service/**'
      - ".github/workflows/ci-order-service.yaml"

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & Run Tests
      run: |
        cd src/order-service
        pip install --no-cache-dir -r requirements.txt pytest pytest-mock
        pytest test_app.py

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # ĐÃ SỬA TẠI ĐÂY: Dùng biến môi trường chuẩn của Bash ($GITHUB_REPOSITORY_LOWER,,) thay vì biểu thức GitHub Actions
    - name: Downcase REPO name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY_LOWER,,}" >> $GITHUB_ENV
      env:
        GITHUB_REPOSITORY_LOWER: ${{ github.repository }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./src/order-service
        push: true
        tags: ghcr.io/${{ env.REPO_LOWER }}/order-service:${{ github.sha }}

    - name: Setup Kustomize
      uses: imranismail/setup-kustomize@v2

    - name: Update Image Tag in Kustomize
      run: |
        cd k8s/environments/dev
        kustomize edit set image order-image-placeholder=ghcr.io/${{ env.REPO_LOWER }}/order-service:${{ github.sha }}

    - name: Commit and Push Manifest Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add k8s/environments/dev/kustomization.yaml
        
        # Chỉ commit nếu thực sự có sự thay đổi
        git commit -m "chore(gitops): update order-service tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
        
        # CHIẾN THUẬT: Vòng lặp kéo code mới về (rebase) rồi push, thử lại tối đa 5 lần nếu bị tranh giành
        for i in {1..5}; do
          echo "Đang thử push lần $i..."
          git pull --rebase origin main
          if git push origin main; then
            echo "✅ Push cấu hình thành công!"
            exit 0
          fi
          echo "❌ Push thất bại do xung đột, đang đợi để thử lại..."
          sleep $((RANDOM % 5 + 2)) # Nghỉ ngẫu nhiên từ 2-7 giây để tránh các job đâm sầm vào nhau lần nữa
        done
        exit 1
