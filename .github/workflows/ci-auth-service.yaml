name: CI Auth Service

on:
  push:
    branches:
      - main
    paths:
      - 'src/auth-service/**'

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & Run Tests
      run: |
        cd src/auth-service
        pip install --no-cache-dir -r requirements.txt pytest 
        pytest test_app.py

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${ github.actor }
        password: ${ secrets.GITHUB_TOKEN }

    - name: Downcase REPO name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./src/auth-service
        push: true
        tags: ghcr.io/${ env.REPO_LOWER }/auth-service:${ github.sha }

    - name: Setup Kustomize
      uses: imranismail/setup-kustomize@v2

    - name: Update Image Tag in Kustomize
      run: |
        cd k8s/environments/dev
        kustomize edit set image auth-image-placeholder=ghcr.io/${ env.REPO_LOWER }/auth-service:${ github.sha }

    - name: Commit and Push Manifest Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add k8s/environments/dev/kustomization.yaml
        git commit -m "chore(gitops): update auth-service tag to ${ github.sha } [skip ci]" || echo "No changes to commit"
        git push
