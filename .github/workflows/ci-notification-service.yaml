name: CI Notification Service

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/notification-service/**'
      - ".github/workflows/ci-notification-service.yaml"

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & Run Tests
      run: |
        cd src/notification-service
        pip install --no-cache-dir -r requirements.txt pytest pytest-mock
        pytest test_app.py

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Downcase REPO name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY_LOWER,,}" >> $GITHUB_ENV
      env:
        GITHUB_REPOSITORY_LOWER: ${{ github.repository }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./src/notification-service
        push: true
        tags: ghcr.io/${{ env.REPO_LOWER }}/notification-service:${{ github.sha }}

    # Dùng yq để cập nhật values.yaml của Helm
    - name: Update Image Tag in Helm values.yaml
      run: |
        yq -i '.services."notification-service".repository = "ghcr.io/'"${{ env.REPO_LOWER }}"'/notification-service"' helm-charts/app-dev/values.yaml
        yq -i '.services."notification-service".tag = "${{ github.sha }}"' helm-charts/app-dev/values.yaml

    - name: Commit and Push Manifest Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add helm-charts/app-dev/values.yaml
        
        # Chỉ commit nếu thực sự có sự thay đổi
        git commit -m "chore(gitops): update notification-service helm tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
        
        # CHIẾN THUẬT: Vòng lặp kéo code mới về (rebase) rồi push, thử lại tối đa 5 lần
        for i in {1..5}; do
          echo "Đang thử push lần $i..."
          git pull --rebase origin hybrid-helm-dev
          if git push origin hybrid-helm-dev; then
            echo "✅ Push cấu hình thành công!"
            exit 0
          fi
          echo "❌ Push thất bại do xung đột, đang đợi để thử lại..."
          sleep $((RANDOM % 5 + 2))
        done
        exit 1
