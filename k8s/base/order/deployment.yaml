apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: order-image-placeholder
        ports:
        - containerPort: 8000
        env:
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:8000"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:8000"